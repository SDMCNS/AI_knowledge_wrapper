[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-wrapper"
version = "0.1.0"
description = "API-based library for wrapping Gemini & local LLM sessions with grounded local SQLite knowledge retrieval"
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity AI" }
]
dependencies = [
    "pydantic>=2.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0",
    "tiktoken>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sse-starlette>=2.0.0",
    "google-genai>=1.0.0",
    "sentence-transformers>=3.0.0",
    "flashrank>=0.2.0",
    "requests>=2.31.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
akw = "akw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
